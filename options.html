<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LISTEN校正アシストの設定</title>
  <link rel="stylesheet" href="options.css">
  <script src="local-ai.js" defer></script>
  <script src="options.js" defer></script>
</head>
<body>
  <main>
    <h1>LISTEN校正アシストの設定</h1>
    <form id="settings">
      <label class="check"><input id="enabled" type="checkbox">ローカルAIによる誤字候補の生成を有効にする</label>
      <p>初期状態は無効です。有効にすると校正バーに「AI候補生成」を表示します。</p>
      <label for="provider">接続方式</label>
      <select id="provider">
        <option value="ollama">Ollama</option>
        <option value="lmstudio">LM Studio</option>
      </select>
      <label for="address">ローカルAIのアドレス</label>
      <input id="address" type="url" required placeholder="http://localhost:11434" spellcheck="false">
      <p id="server-help">起動済みのOllamaサーバーを指定してください。モデル一覧の取得時に、このアドレスへの接続許可を求めます。</p>
      <button id="refresh" type="button">インストール済みモデルを取得</button>
      <label for="model">モデル</label>
      <select id="model"><option value="">モデルを取得して選択してください</option></select>
      <p>文字起こしはボタンを押したときだけ指定したサーバーに送信します。ローカルで実行するモデルを使用してください。生成結果はCSV候補として読み込み、置換は手動で確認します。</p>
      <button id="save" type="submit">設定を保存</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
